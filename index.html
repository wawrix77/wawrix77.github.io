<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój FACEIT Widget</title>
    <style>
        body {
            background-color: transparent; /* Przezroczyste tło do OBS */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Kompaktowy, poziomy prostokąt z cyjanowym neonem */
        .widget-container {
            background: linear-gradient(135deg, #0d1117 0%, #070a0f 100%);
            border: 2px solid #00f0ff; /* Cyjanowy neon */
            border-radius: 10px;
            padding: 12px 20px;
            width: 380px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 8px rgba(0, 240, 255, 0.2);
            box-sizing: border-box;
            margin: 10px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .row-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nickname {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .level-badge {
            font-size: 11px;
            background-color: #00f0ff;
            color: #000;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: bold;
            box-shadow: 0 0 5px #00f0ff;
        }

        .elo-display {
            font-size: 18px;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
        }

        .stats-side {
            display: flex;
            gap: 15px;
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            padding-left: 15px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            color: #8a92a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: bold;
        }

        .plus {
            color: #00ff66;
            text-shadow: 0 0 8px #00ff66;
        }

        .minus {
            color: #ff3333;
            text-shadow: 0 0 8px #ff3333;
        }

        .neutral {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="player-info">
            <div class="row-top">
                <div class="nickname" id="player-name">Ładowanie...</div>
                <div class="level-badge" id="player-level">LVL -</div>
            </div>
            <div class="elo-display" id="player-elo">---- ELO</div>
        </div>

        <div class="stats-side">
            <div class="stat-box">
                <div class="stat-label">Dzisiaj W/L</div>
                <div class="stat-value" id="daily-wl">0W - 0L</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Dzisiaj ELO</div>
                <div class="stat-value" id="daily-elo">0</div>
            </div>
        </div>
    </div>

    <script>
        const FACEIT_NICKNAME = "wawrix22"; 

        async function fetchFaceitStats() {
            try {
                // Wykorzystujemy alternatywne, stabilne i publiczne źródło danych bez blokady CORS
                const response = await fetch(`https://v06.pro{FACEIT_NICKNAME}`);
                if (!response.ok) throw new Error('Błąd pobierania');
                const data = await response.json();

                // Przypisanie nicku, elo oraz poziomu
                document.getElementById('player-name').innerText = data.nickname || FACEIT_NICKNAME;
                document.getElementById('player-elo').innerText = `${data.elo} ELO`;
                document.getElementById('player-level').innerText = `LVL ${data.level}`;

                // Wyciąganie statystyk z dzisiejszego dnia (W/L i ELO change)
                let wins = data.today?.wins || 0;
                let losses = data.today?.losses || 0;
                let eloChange = data.today?.elo_diff || 0;

                document.getElementById('daily-wl').innerText = `${wins}W - ${losses}L`;
                
                const eloElement = document.getElementById('daily-elo');
                if (eloChange > 0) {
                    eloElement.innerText = `+${eloChange}`;
                    eloElement.className = "stat-value plus";
                } else if (eloChange < 0) {
                    eloElement.innerText = `${eloChange}`;
                    eloElement.className = "stat-value minus";
                } else {
                    eloElement.innerText = "0";
                    eloElement.className = "stat-value neutral";
                }

            } catch (error) {
                console.error("Błąd widgetu:", error);
                document.getElementById('player-name').innerText = "Błąd połączenia";
            }
        }

        // Pierwsze uruchomienie i odświeżanie co 60 sekund
        fetchFaceitStats();
        setInterval(fetchFaceitStats, 60000);
    </script>
</body>
</html>
