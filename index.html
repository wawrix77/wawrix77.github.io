<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój FACEIT Widget</title>
    <style>
        /* Ciemne tło dla klimatu gamingowego */
        body {
    background-color: transparent; /* Zmień to, aby tło było przezroczyste w OBS */
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}


        /* Główny kontener widgetu z neonową poświatą */
        .widget-container {
            background: linear-gradient(135deg, #141822 0%, #0f111a 100%);
            border: 2px solid #ff5500; /* Kolor Faceit Orange */
            border-radius: 16px;
            padding: 25px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 20px #ff5500, inset 0 0 10px rgba(255, 85, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Efekt pulsującego neonu */
        .widget-container:hover {
            box-shadow: 0 0 35px #ff5500, inset 0 0 15px rgba(255, 85, 0, 0.5);
            transform: scale(1.02);
        }

        .nickname {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* Poziom ELO i Level */
        .elo-display {
            font-size: 36px;
            font-weight: 800;
            color: #ff5500;
            text-shadow: 0 0 12px #ff5500;
            margin: 10px 0;
        }

        .level-badge {
            font-size: 16px;
            background-color: #ff5500;
            color: black;
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 0 8px #ff5500;
        }

        /* Sekcja statystyk z dzisiaj */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            border-top: 1px solid rgba(255, 85, 0, 0.2);
            padding-top: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 11px;
            color: #8a92a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        /* Kolory neonowe dla bilansu i zmian ELO */
        .plus {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .minus {
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
        }

        .neutral {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="nickname" id="player-name">Ładowanie...</div>
        <div class="level-badge" id="player-level">LVL -</div>
        <div class="elo-display" id="player-elo">---- ELO</div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Bilans dzisiaj</div>
                <div class="stat-value" id="daily-wl">0W - 0L</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Bilans ELO</div>
                <div class="stat-value" id="daily-elo">0</div>
            </div>
        </div>
    </div>

    <script>
        // === TUTAJ WPISZ SWÓJ DOKŁADNY NICKNAME Z FACEIT ===
        const FACEIT_NICKNAME = "wawrix22"; 

        async function fetchFaceitStats() {
            try {
                // Wykorzystujemy publiczne API narzędziowe dedykowane dla streamerów i widgetów
                const response = await fetch(`https://vxh.rocks{FACEIT_NICKNAME}`);
                if (!response.ok) throw new Error('Problem z pobraniem danych');
                
                const data = await response.json();
                
                // Przypisanie podstawowych danych gracza
                document.getElementById('player-name').innerText = data.nickname || FACEIT_NICKNAME;
                document.getElementById('player-elo').innerText = `${data.games.cs2.faceit_elo} ELO`;
                document.getElementById('player-level').innerText = `LVL ${data.games.cs2.skill_level}`;

                // Pobieranie historii meczów, aby wyliczyć statystyki z dzisiejszego dnia
                const historyResponse = await fetch(`https://vxh.rocks{data.player_id}/history?game=cs2&limit=20`);
                const historyData = await historyResponse.json();

                let wins = 0;
                let losses = 0;
                let eloChange = 0;

                const today = new Date().toDateString();

                // Filtrowanie meczów rozegranych dzisiaj
                if (historyData && historyData.items) {
                    historyData.items.forEach(match => {
                        const matchDate = new Date(match.finished_at * 1000).toDateString();
                        
                        if (matchDate === today) {
                            // Sprawdzamy czy mecz był wygrany
                            // Uwaga: Dokładny bilans zależy od konfiguracji sesji API. 
                            // W przypadku ograniczeń prostych API open-source, poniższa sekcja agreguje trendy:
                            if (match.results && match.results.winner === match.teams.faction1.players.some(p => p.nickname === FACEIT_NICKNAME) ? 'faction1' : 'faction2') {
                                wins++;
                                eloChange += 25; // Przybliżona wartość bazowa ELO za mecz
                            } else {
                                losses++;
                                eloChange -= 25;
                            }
                        }
                    });
                }

                // Aktualizacja pól na stronie
                document.getElementById('daily-wl').innerText = `${wins}W - ${losses}L`;
                
                const eloElement = document.getElementById('daily-elo');
                if (eloChange > 0) {
                    eloElement.innerText = `+${eloChange}`;
                    eloElement.className = "stat-value plus";
                } else if (eloChange < 0) {
                    eloElement.innerText = `${eloChange}`;
                    eloElement.className = "stat-value minus";
                } else {
                    eloElement.innerText = "0";
                    eloElement.className = "stat-value neutral";
                }

            } catch (error) {
                console.error("Błąd ładowania widgetu:", error);
                document.getElementById('player-name').innerText = "Błąd profilu";
            }
        }

        // Uruchomienie funkcji i automatyczne odświeżanie co 2 minuty
        fetchFaceitStats();
        setInterval(fetchFaceitStats, 120000);
    </script>
</body>
</html>
