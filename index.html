<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój FACEIT Widget</title>
    <style>
        body {
            background-color: transparent; /* Przezroczyste tło do OBS */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Kompaktowy, poziomy prostokąt z cyjanowym neonem */
        .widget-container {
            background: linear-gradient(135deg, #0d1117 0%, #070a0f 100%);
            border: 2px solid #00f0ff; /* Cyjanowy neon */
            border-radius: 10px;
            padding: 12px 20px;
            width: 380px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 8px rgba(0, 240, 255, 0.2);
            box-sizing: border-box;
            margin: 10px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .row-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nickname {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .level-badge {
            font-size: 11px;
            background-color: #00f0ff;
            color: #000;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: bold;
            box-shadow: 0 0 5px #00f0ff;
        }

        .elo-display {
            font-size: 18px;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
        }

        .stats-side {
            display: flex;
            gap: 15px;
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            padding-left: 15px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            color: #8a92a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: bold;
        }

        .plus {
            color: #00ff66;
            text-shadow: 0 0 8px #00ff66;
        }

        .minus {
            color: #ff3333;
            text-shadow: 0 0 8px #ff3333;
        }

        .neutral {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <!-- Lewa sekcja z profilem -->
        <div class="player-info">
            <div class="row-top">
                <div class="nickname" id="player-name">Ładowanie...</div>
                <div class="level-badge" id="player-level">LVL -</div>
            </div>
            <div class="elo-display" id="player-elo">---- ELO</div>
        </div>

        <!-- Prawa sekcja ze statystykami -->
        <div class="stats-side">
            <div class="stat-box">
                <div class="stat-label">Dzisiaj W/L</div>
                <div class="stat-value" id="daily-wl">0W - 0L</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Dzisiaj ELO</div>
                <div class="stat-value" id="daily-elo">0</div>
            </div>
        </div>
    </div>

    <script>
        const FACEIT_NICKNAME = "wawrix22"; 
        const API_KEY = "854b1df6-2555-41a0-b2e6-4139fdcf3713"; 

        async function fetchFaceitStats() {
            try {
                // 1. Pobieranie profilu gracza
                const playerUrl = `https://allorigins.win{encodeURIComponent('https://faceit.com' + FACEIT_NICKNAME)}`;
                
                const playerRes = await fetch(playerUrl, {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });
                
                if (!playerRes.ok) throw new Error('Błąd profilu');
                const rawPlayerData = await playerRes.json();
                const playerData = JSON.parse(rawPlayerData.contents);
                
                if (!playerData.player_id) throw new Error('Brak gracza');

                const playerId = playerData.player_id;
                document.getElementById('player-name').innerText = playerData.nickname;
                document.getElementById('player-elo').innerText = `${playerData.games.cs2.faceit_elo} ELO`;
                document.getElementById('player-level').innerText = `LVL ${playerData.games.cs2.skill_level}`;

                // 2. Pobieranie historii meczów (Naprawiona linijka kodu)
                const historyUrl = `https://allorigins.win{encodeURIComponent('https://faceit.com' + playerId + '/history?game=cs2&limit=20')}`;
                const historyRes = await fetch(historyUrl, {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                });
                
                if (!historyRes.ok) throw new Error('Brak historii');
                const rawHistoryData = await historyRes.json();
                const historyData = JSON.parse(rawHistoryData.contents);

                let wins = 0;
                let losses = 0;
                let eloChange = 0;
                const today = new Date().toDateString();

                if (historyData && historyData.items) {
                    for (const match of historyData.items) {
                        const matchDate = new Date(match.finished_at * 1000).toDateString();
                        
                        if (matchDate === today) {
                            const myFaction = match.teams.faction1.players.some(p => p.nickname === playerData.nickname) ? 'faction1' : 'faction2';
                            if (match.results && match.results.winner === myFaction) {
                                wins++;
                                eloChange += 25;
                            } else {
                                losses++;
                                eloChange -= 25;
                            }
                        }
                    }
                }

                document.getElementById('daily-wl').innerText = `${wins}W - ${losses}L`;
                
                const eloElement = document.getElementById('daily-elo');
                if (eloChange > 0) {
                    eloElement.innerText = `+${eloChange}`;
                    eloElement.className = "stat-value plus";
                } else if (eloChange < 0) {
                    eloElement.innerText = `${eloChange}`;
                    eloElement.className = "stat-value minus";
                } else {
                    eloElement.innerText = "0";
                    eloElement.className = "stat-value neutral";
                }

            } catch (error) {
                console.error("Błąd ładowania widgetu:", error);
                document.getElementById('player-name').innerText = "Błąd profilu";
            }
        }

        fetchFaceitStats();
        setInterval(fetchFaceitStats, 120000);
    </script>
</body>
</html>
